name: Windows Flutter CI (x64 only)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建哪些平台 (all=桌面+手机, mobile=只手机, windows=只桌面)"
        type: choice
        default: all
        options:
          - all
          - mobile
          - windows

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # iOS: macos-latest = Xcode 26, 需要 Flutter >= 3.44 (3.24.5 的 deployment target 12.0 被 Xcode 26 拒绝)
  FLUTTER_IOS_VERSION: "3.44.9"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  # AWS CLI retry configuration for R2 operations
  AWS_MAX_ATTEMPTS: "5"
  AWS_RETRY_MODE: "standard"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
  # Android 正式签名 (为空则产物为 debug 签名, 无法覆盖安装已装版本)
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  # Custom server configuration (embedded at build time)
  CUSTOM_RENDEZVOUS_SERVER: "${{ secrets.CUSTOM_RENDEZVOUS_SERVER }}"
  CUSTOM_RS_PUB_KEY: "${{ secrets.CUSTOM_RS_PUB_KEY }}"
  CUSTOM_RENDEZVOUS_PORT: "${{ secrets.CUSTOM_RENDEZVOUS_PORT }}"
  CUSTOM_RELAY_PORT: "${{ secrets.CUSTOM_RELAY_PORT }}"
  CUSTOM_WS_RENDEZVOUS_PORT: "${{ secrets.CUSTOM_WS_RENDEZVOUS_PORT }}"
  CUSTOM_WS_RELAY_PORT: "${{ secrets.CUSTOM_WS_RELAY_PORT }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    secrets: inherit

  build-RustDeskTempTopMostWindow:
    if: inputs.platform != 'mobile'
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    secrets: inherit
    with:
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-flutter:
    name: x86_64-pc-windows-msvc
    if: inputs.platform != 'mobile'
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Redirect googlesource fetches to GitHub mirrors
        # googlesource.com (chromium/aomedia) 偶发 502/503, 会让 cargo 拉 rust-webm 的
        # libwebm 子模块、vcpkg 拉 libyuv/aom port 失败。git config 的 url.insteadOf
        # 是前缀重写, cargo(libgit2) 和 vcpkg(git) 都会读全局配置, 一步根治。
        shell: bash
        run: |
          git config --global url."https://github.com/webmproject/libwebm.git".insteadOf "https://chromium.googlesource.com/webm/libwebm"
          git config --global url."https://github.com/lemenkov/libyuv.git".insteadOf "https://chromium.googlesource.com/libyuv/libyuv"
          git config --global url."https://github.com/arthenica/libaom.git".insteadOf "https://aomedia.googlesource.com/aom"

      - name: Restore bridge files from R2
        shell: bash
        run: |
          mkdir -p ./src ./flutter/lib ./flutter/macos/Runner ./flutter/ios/Runner
          aws s3 sync s3://${{ secrets.R2_BUCKET_NAME }}/builds/${{ github.run_id }}/bridge/bridge-artifact/ ./src/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
          mv ./src/generated_bridge.dart ./flutter/lib/
          mv ./src/generated_bridge.freezed.dart ./flutter/lib/
          mv ./src/bridge_generated.h ./flutter/macos/Runner/
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: the rustdesk/engine windows-x64-release.zip is built for the
      # 3.24-era x64 engine (matches FLUTTER_VERSION).
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          $engineZipTmp = Join-Path $PWD ([System.IO.Path]::GetRandomFileName() + ".zip")
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile $engineZipTmp
          Move-Item -Force $engineZipTmp windows-x64-release.zip

      - name: Install custom flutter engine
        run: |
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        # googlesource.com (aom/libyuv 等 port 源) 偶发 HTTP 502, 带重试
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          USE_AOM_391: 1
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_wait_seconds: 120
          shell: bash
          command: |
            if ! $VCPKG_ROOT/vcpkg \
              install \
              --triplet x64-windows-static \
              --x-install-root="$VCPKG_ROOT/installed"; then
              find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
                echo "$_1:"
                echo "======"
                cat "$_1"
                echo "======"
                echo ""
              done
              exit 1
            fi
            head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Prefetch cargo dependencies with retry
        # cargo 的 git 依赖 (如 rust-webm 的 libwebm 子模块, 指向 chromium.googlesource.com)
        # 偶发 HTTP 502 会直接让 build.py 里的 cargo build 失败; 先带重试地 fetch 预热,
        # 之后 cargo build 直接命中本地 checkout, 不再需要联网
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: bash
          command: cargo fetch --locked

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; --vram is the x64 extra
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Download usbmmidd_v2 with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            $tmpZip = Join-Path $PWD.Path ("usbmmidd_v2.{0}.zip" -f ([guid]::NewGuid().ToString("N").Substring(0, 6)))
            curl.exe -fL --retry 5 --retry-all-errors --retry-delay 30 -o $tmpZip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
            Move-Item -Force $tmpZip .\usbmmidd_v2.zip

      - name: Extract usbmmidd_v2
        run: |
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download printer driver files with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            $tmpDriver = Join-Path $PWD.Path ("rustdesk_printer_driver_v4-1.4.{0}.zip" -f ([guid]::NewGuid().ToString("N").Substring(0, 6)))
            $tmpAdapter = Join-Path $PWD.Path ("printer_driver_adapter.{0}.zip" -f ([guid]::NewGuid().ToString("N").Substring(0, 6)))
            $tmpChecksums = Join-Path $PWD.Path ("sha256sums.{0}" -f ([guid]::NewGuid().ToString("N").Substring(0, 6)))
            curl.exe -fL --retry 5 --retry-all-errors --retry-delay 30 -o $tmpDriver https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip
            curl.exe -fL --retry 5 --retry-all-errors --retry-delay 30 -o $tmpAdapter https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip
            curl.exe -fL --retry 5 --retry-all-errors --retry-delay 30 -o $tmpChecksums https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums
            Move-Item -Force $tmpDriver rustdesk_printer_driver_v4-1.4.zip
            Move-Item -Force $tmpAdapter printer_driver_adapter.zip
            Move-Item -Force $tmpChecksums sha256sums

      - name: Install printer driver files
        run: |
          try {
            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow from R2
        shell: bash
        run: |
          mkdir -p ./rustdesk
          aws s3 cp s3://${{ secrets.R2_BUCKET_NAME }}/builds/${{ github.run_id }}/topmostwindow/x64/WindowInjection.dll ./rustdesk/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Sign rustdesk files
        if: env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        # Builds the MSI for x64. res/msi (WiX v4 + native CustomActions) carries
        # both x64 and ARM64 platform configs; msbuild platform is x64 and the
        # produced Package.msi is globbed since its bin/<platform>/ dir varies.
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi
          sha256sum ../../SignOutput/rustdesk-*.msi

      - name: Sign rustdesk self-extracted file
        if: env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

      - name: Upload to R2
        shell: bash
        run: |
          DATE=$(date +%Y%m%d)
          aws s3 cp ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe s3://${{ secrets.R2_BUCKET_NAME }}/${{ env.VERSION }}/${DATE}/windows/x86_64/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
          aws s3 cp ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi s3://${{ secrets.R2_BUCKET_NAME }}/${{ env.VERSION }}/${DATE}/windows/x86_64/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # 手机版 (Android)。
  # 视频流"画面冻结"这类问题最初是在手机上发现的, 手机端与桌面端共用同一套
  # Rust 视频收发/解码逻辑 (src/client.rs + src/client/io_loop.rs), 只编桌面版
  # 无法验证手机端是否修好 —— 所以 Windows 这条 CI 必须同时产出 APK。
  # 内容与 .github/workflows/flutter-build.yml 的 build-rustdesk-android 一致,
  # 单独复制一份是为了不在那个"全平台"工作流里加条件 (会牵动十几个 job 的 needs)。
  build-rustdesk-android:
    if: inputs.platform != 'windows'
    needs: [generate-bridge]
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
          - {
              arch: x86_64,
              target: x86_64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Redirect googlesource fetches to GitHub mirrors
        shell: bash
        run: |
          git config --global url."https://github.com/webmproject/libwebm.git".insteadOf "https://chromium.googlesource.com/webm/libwebm"
          git config --global url."https://github.com/lemenkov/libyuv.git".insteadOf "https://chromium.googlesource.com/libyuv/libyuv"
          git config --global url."https://github.com/arthenica/libaom.git".insteadOf "https://aomedia.googlesource.com/aom"

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 60
          command: |
            # Download vcpkg if not exists
            if [ ! -d "/opt/artifacts/vcpkg/.git" ]; then
              git clone https://github.com/microsoft/vcpkg.git /opt/artifacts/vcpkg
              cd /opt/artifacts/vcpkg
              git checkout ${{ env.VCPKG_COMMIT_ID }}
            fi
            # Bootstrap vcpkg
            cd /opt/artifacts/vcpkg
            ./bootstrap-vcpkg.sh -disableMetrics
          on_retry_command: |
            echo "Retrying vcpkg setup..."
            rm -rf /opt/artifacts/vcpkg || true

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=/opt/artifacts/vcpkg" >> $GITHUB_ENV

      - name: Install vcpkg dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 120
          command: |
            case ${{ matrix.job.target }} in
              aarch64-linux-android)
                ANDROID_TARGET=arm64-v8a
              ;;
              armv7-linux-androideabi)
                ANDROID_TARGET=armeabi-v7a
              ;;
              x86_64-linux-android)
                ANDROID_TARGET=x86_64
              ;;
            esac
            if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
              find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
                echo "$_1:"
                echo "======"
                cat "$_1"
                echo "======"
                echo ""
              done
              exit 1
            fi
          on_retry_command: |
            echo "Retrying vcpkg install, cleaning up..."
            rm -rf ${VCPKG_ROOT}/buildtrees ${VCPKG_ROOT}/installed ${VCPKG_ROOT}/packages || true
        env:
          VCPKG_ROOT: /opt/artifacts/vcpkg

      - name: Restore bridge files from R2
        shell: bash
        run: |
          mkdir -p ./src ./flutter/lib ./flutter/macos/Runner ./flutter/ios/Runner
          aws s3 sync s3://${{ secrets.R2_BUCKET_NAME }}/builds/${{ github.run_id }}/bridge/bridge-artifact/ ./src/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
          mv ./src/generated_bridge.dart ./flutter/lib/
          mv ./src/generated_bridge.freezed.dart ./flutter/lib/
          mv ./src/bridge_generated.h ./flutter/macos/Runner/
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Install cargo-ndk with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            ;;
            armv7-linux-androideabi)
              ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            ;;
            x86_64-linux-android)
              ./flutter/ndk_x64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            ;;
          esac

      - name: Build rustdesk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # temporary use debug sign config
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            armv7-linux-androideabi)
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm --split-per-abi
              mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            x86_64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
          esac
          popd
          mkdir -p signed-apk; pushd signed-apk
          mv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .

      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - name: Verify signing configuration
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::warning::ANDROID_SIGNING_KEY 未设置 -> 跳过正式签名, 产物为 debug 签名, 无法覆盖安装"
            exit 0
          fi
          missing=""
          [ -z "$SIGNING_ALIAS" ] && missing="$missing ANDROID_ALIAS"
          [ -z "$SIGNING_STORE_PASSWORD" ] && missing="$missing ANDROID_KEY_STORE_PASSWORD"
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::以下 secrets 已设置 ANDROID_SIGNING_KEY 但仍为空:$missing"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > /tmp/signingKey.jks 2>/dev/null || {
            echo "::error::ANDROID_SIGNING_KEY 不是合法的 base64"; exit 1; }
          if ! keytool -list -keystore /tmp/signingKey.jks -storetype PKCS12 \
                 -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 校验失败: ANDROID_KEY_STORE_PASSWORD 或 ANDROID_ALIAS 与 keystore 不匹配"
            echo "  本地自查: python .rd-ci/verify-android-keystore.py --keystore <ks> --b64 <ks>.b64"
            echo "  常见原因: 网页填 secret 时带入尾随空格/换行; 生成 keystore 时密码用了双引号导致 \$ ! 被 shell 吞掉"
            exit 1
          fi
          echo "签名配置校验通过 (alias=$SIGNING_ALIAS)"

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        if: env.ANDROID_SIGNING_KEY != null
        id: sign-rustdesk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload to R2
        shell: bash
        run: |
          DATE=$(date +%Y%m%d)
          if [ "${{ env.ANDROID_SIGNING_KEY }}" != "" ]; then
            APK_FILE="${{steps.sign-rustdesk.outputs.signedReleaseFile}}"
          else
            APK_FILE="signed-apk/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk"
          fi
          case ${{ matrix.job.arch }} in
            aarch64) ANDROID_ARCH="arm64-v8a" ;;
            armv7) ANDROID_ARCH="armeabi-v7a" ;;
            x86_64) ANDROID_ARCH="x86_64" ;;
          esac
          aws s3 cp "$APK_FILE" s3://${{ secrets.R2_BUCKET_NAME }}/${{ env.VERSION }}/${DATE}/android/${ANDROID_ARCH}/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload librustdesk.so to R2 (intermediate)
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              LIB_NAME="librustdesk.so.aarch64-linux-android"
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so /tmp/${LIB_NAME}
            ;;
            armv7-linux-androideabi)
              LIB_NAME="librustdesk.so.armv7-linux-androideabi"
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so /tmp/${LIB_NAME}
            ;;
            x86_64-linux-android)
              LIB_NAME="librustdesk.so.x86_64-linux-android"
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so /tmp/${LIB_NAME}
            ;;
          esac
          aws s3 cp /tmp/${LIB_NAME} s3://${{ secrets.R2_BUCKET_NAME }}/builds/${{ github.run_id }}/android-libs/${LIB_NAME} \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # 手机版 (iOS)。
  # 与上面的 Android job 同理: 视频流的收发/解码逻辑 (src/client.rs +
  # src/client/io_loop.rs) 在桌面端与手机端是同一份 Rust 代码, 只编 Windows 无法
  # 验证手机端, 所以这条 CI 同时产出 ipa。
  # 未签名 ipa: 不需要任何 Apple 证书/profile, 供 TrollStore / 越狱设备 /
  # AltStore-Sideloadly 使用。
  #
  # runner / Flutter 版本的选择 (2026-11):
  # - macos-14 镜像已于 2026-11-02 被 GitHub 退役 (含 macos-14-large/xlarge),
  #   标签拿不到 runner → job 会被秒标记 cancelled (无日志、无 step)。
  #   官方替代: macos-latest / macos-15 / macos-26。
  # - macos-latest = macOS 26 + Xcode 26.6; macos-15 最低只有 Xcode 16.0。
  #   Flutter 3.24.5 的最低 iOS deployment target 是 12.0, 而 Xcode 26 要求
  #   >= 15.x → 必然报 "deployment target ... is set to 12.0, but the range of
  #   supported deployment target versions is ..."。所以这里改用 Flutter 3.44
  #   (仓库里 Windows arm64 那条线已经验证过的 3.44 组合: 配套的
  #   bridge-artifact-flutter-3.44 + apply_flutter_3.44_source_patches.sh)。
  build-rustdesk-ios:
    if: inputs.platform != 'windows'
    name: build rustdesk ios ipa
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-apple-ios,
              os: macos-15,
              vcpkg-triplet: arm64-ios,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm
      - name: Select Xcode
        # macos-15 的默认 Xcode 是 16.4, 镜像里的 simulator runtime 也是按它配的。
        # 显式选 16.0 会让 CocoaPods 阶段报 "No simulator runtime version from
        # [<DVTBuildVersion ...>]" —— 16.0 认不出镜像里的 iOS 18.5 runtime。
        # deployment target 反而没问题: Xcode 16 支持的最低是 iOS 12.0,
        # 正好是 Flutter 3.24.5 的最低要求 (Xcode 26 就要求 >= 15.x 了)。
        # 若镜像将来不再带 16.4, 就退回镜像默认的 Xcode。
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          xcode-select -p

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Redirect googlesource fetches to GitHub mirrors
        shell: bash
        run: |
          git config --global url."https://github.com/webmproject/libwebm.git".insteadOf "https://chromium.googlesource.com/webm/libwebm"
          git config --global url."https://github.com/lemenkov/libyuv.git".insteadOf "https://chromium.googlesource.com/libyuv/libyuv"
          git config --global url."https://github.com/arthenica/libaom.git".insteadOf "https://aomedia.googlesource.com/aom"

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 60
          command: |
            # Setup vcpkg in default location
            if [ ! -d "${VCPKG_INSTALLATION_ROOT:-/usr/local/vcpkg}/.git" ]; then
              git clone https://github.com/microsoft/vcpkg.git "${VCPKG_INSTALLATION_ROOT:-/usr/local/vcpkg}"
              cd "${VCPKG_INSTALLATION_ROOT:-/usr/local/vcpkg}"
              git checkout ${{ env.VCPKG_COMMIT_ID }}
            fi
            # Bootstrap vcpkg
            cd "${VCPKG_INSTALLATION_ROOT:-/usr/local/vcpkg}"
            ./bootstrap-vcpkg.sh -disableMetrics
            echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-/usr/local/vcpkg}" >> $GITHUB_ENV
          on_retry_command: |
            echo "Retrying vcpkg setup..."
            rm -rf "${VCPKG_INSTALLATION_ROOT:-/usr/local/vcpkg}" || true

      - name: Install vcpkg dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_wait_seconds: 120
          shell: bash
          command: |
            if ! $VCPKG_ROOT/vcpkg \
              install \
              --triplet ${{ matrix.job.vcpkg-triplet }} \
              --x-install-root="$VCPKG_ROOT/installed"; then
              find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
                echo "$_1:"
                echo "======"
                cat "$_1"
                echo "======"
                echo ""
              done
              exit 1
            fi
            head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
          on_retry_command: |
            echo "Retrying vcpkg install, cleaning up..."
            rm -rf "${VCPKG_ROOT}/buildtrees" "${VCPKG_ROOT}/packages" || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: ${{ matrix.job.target }}

      - name: Restore bridge files from R2
        shell: bash
        run: |
          mkdir -p ./src ./flutter/lib ./flutter/macos/Runner ./flutter/ios/Runner
          aws s3 sync s3://${{ secrets.R2_BUCKET_NAME }}/builds/${{ github.run_id }}/bridge/bridge-artifact/ ./src/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
            --region auto
          mv ./src/generated_bridge.dart ./flutter/lib/
          mv ./src/generated_bridge.freezed.dart ./flutter/lib/
          mv ./src/bridge_generated.h ./flutter/macos/Runner/
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Build rustdesk lib
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Install ldid
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: brew install ldid

      - name: Build rustdesk
        shell: bash
        run: |
          pushd flutter
          # 构建 (不需要任何 Apple 证书 / provisioning profile)
          # 注: Flutter 3.24.5 在 no-codesign 下只产 Runner.xcarchive, 会打印
          #     "Codesigning disabled with --no-codesign, skipping IPA." 且不创建 ipa 目录,
          #     所以 ipa 由 .github/scripts/create-ios-ipa.sh 手工打 Payload 产出。
          # 注: zip 的输出目录必须先存在, 否则 zip 报 "Could not create output file" 并以
          #     exit 15 终止 (2026-09-24 run 35996632080 的失败点)。
          flutter build ipa --release --no-codesign || true
          mkdir -p build/ios/ipa
          if ! ls build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app >/dev/null 2>&1 \
             && ! ls build/ios/iphoneos/Runner.app >/dev/null 2>&1; then
            echo "::warning::未找到已构建的 Runner.app, 重新执行 flutter build ios"
            flutter build ios --release --no-codesign
          fi
          popd

          # 产出两个 ipa: 未签名版 + 越狱版 (ldid 注入 application-identifier)
          VERSION="${{ env.VERSION }}" bash .github/scripts/create-ios-ipa.sh

      - name: Install AWS CLI
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            cd /tmp
            curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
            sudo installer -pkg AWSCLIV2.pkg -target /

      - name: Upload to R2
        shell: bash
        run: |
          DATE=$(date +%Y%m%d)
          DEST="s3://${{ secrets.R2_BUCKET_NAME }}/${{ env.VERSION }}/${DATE}/ios/arm64"
          shopt -s nullglob
          IPAS=(flutter/build/ios/ipa/*.ipa)
          if [ ${#IPAS[@]} -eq 0 ]; then
            echo "ERROR: No .ipa file found in flutter/build/ios/ipa/"
            ls -la flutter/build/ios/ipa/ || true
            exit 1
          fi
          for f in "${IPAS[@]}"; do
            echo "Uploading: $f"
            aws s3 cp "$f" "$DEST/" \
              --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} \
              --region auto
          done
          echo "== 已上传到 $DEST =="
          for f in "${IPAS[@]}"; do echo "  - $(basename "$f")"; done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
