name: Probe macOS runner + Flutter/Xcode 兼容性

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: macos-15 + flutter-3.24.5, os: macos-15, flutter: "3.24.5" }
          - { name: macos-latest + flutter-3.24.5, os: macos-latest, flutter: "3.24.5" }
          - { name: macos-15 + flutter-3.44.8, os: macos-15, flutter: "3.44.8" }
          - { name: macos-latest + flutter-3.44.8, os: macos-latest, flutter: "3.44.8" }
    steps:
      - name: Show Xcode inventory
        run: |
          echo "=== xcodebuild -version ==="
          xcodebuild -version || true
          echo "=== /Applications/Xcode* ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "=== xcode-select ==="
          xcode-select -p || true
          echo "=== sw_vers ==="
          sw_vers || true

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter }}

      - name: flutter doctor
        run: |
          echo "=== flutter --version ==="
          flutter --version || true
          echo "=== flutter doctor -v ==="
          flutter doctor -v || true
          echo "=== flutter config ==="
          flutter config --list || true
